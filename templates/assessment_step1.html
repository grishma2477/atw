<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Assessment - NeuroSense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body.ns-assessment {
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --ink: #172443;
            --muted: #52627a;
            --line: #dce4f0;
            --white: #fff;

            margin: 0;
            color: var(--ink);
            background: #f6f7fb;
            font: 16px/1.55 system-ui, sans-serif;
        }

        .ns-assessment *,
        .ns-assessment *::before,
        .ns-assessment *::after {
            box-sizing: border-box;
        }

        .ns-assessment [hidden] {
            display: none;
        }

        .ns-assessment :focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 4px;
        }

        /* Navigation */
        .ns-topbar {
            background: var(--white);
            border-bottom: 1px solid var(--line);
        }

        .ns-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 24px;
            max-width: 1200px;
            margin: auto;
            padding: 14px 24px;
        }

        .ns-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: 750;
        }

        .ns-brand img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .ns-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .ns-links a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 6px 12px;
            border-radius: 9px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
        }

        .ns-links a:hover,
        .ns-links a[aria-current="page"] {
            color: var(--blue-dark);
            background: #edf3ff;
        }

        /* Assessment heading and progress */
        .ns-main {
            width: min(960px, calc(100% - 32px));
            margin: 36px auto 56px;
        }

        .ns-hero,
        .ns-card {
            border-radius: 20px;
            padding: clamp(20px, 4vw, 34px);
        }

        .ns-hero {
            color: var(--white);
            background:
                radial-gradient(ellipse at top right, #3675ee, transparent 62%),
                linear-gradient(125deg, #173ba3, #1d4ed8);
            box-shadow: 0 12px 30px rgba(29, 78, 216, .16);
        }

        .ns-hero h1 {
            margin: 4px 0 18px;
            font-size: clamp(27px, 4vw, 42px);
            line-height: 1.14;
            letter-spacing: -.035em;
        }

        .ns-step {
            margin: 0;
            font-size: 14px;
            font-weight: 650;
        }

        .ns-progress {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .ns-progress span {
            height: 5px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .35);
        }

        .ns-progress span:first-child {
            background: var(--white);
        }

        /* Cards and voice controls */
        .ns-card {
            margin-top: 18px;
            border: 1px solid var(--line);
            background: var(--white);
            box-shadow: 0 8px 24px rgba(23, 36, 67, .045);
        }

        .ns-card h2 {
            margin: 0 0 4px;
            font-size: 23px;
            letter-spacing: -.025em;
        }

        .ns-card p {
            margin: 0;
            color: var(--muted);
        }

        .ns-card .ns-note {
            font-size: 14px;
        }

        .ns-voice-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .ns-voice-head h2 {
            font-size: 18px;
        }

        .ns-switch {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            width: 50px;
            height: 44px;
            cursor: pointer;
        }

        .ns-switch input {
            appearance: none;
            width: 50px;
            height: 28px;
            margin: 0;
            border-radius: 100px;
            background: #64748b;
            cursor: pointer;
        }

        .ns-switch input::before {
            content: "";
            display: block;
            width: 20px;
            height: 20px;
            margin: 4px;
            border-radius: 50%;
            background: var(--white);
        }

        .ns-switch input:checked {
            background: var(--blue);
        }

        .ns-switch input:checked::before {
            transform: translateX(22px);
        }

        .ns-voice-panel,
        .ns-age {
            padding: 16px;
            border: 1px solid #dbe7ff;
            border-radius: 12px;
            background: #f3f7ff;
        }

        .ns-voice-panel {
            margin-top: 14px;
        }

        .ns-voice-panel .ns-replay {
            margin-bottom: 10px;
        }

        /* Demographic fields */
        .ns-age {
            margin: 22px 0;
        }

        .ns-age-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .ns-age output {
            padding: 4px 12px;
            border-radius: 999px;
            color: var(--blue-dark);
            background: #e2ecff;
            font-size: 14px;
            font-weight: 750;
        }

        .ns-age input {
            display: block;
            width: 100%;
            height: 28px;
            margin: 8px 0 0;
            accent-color: var(--blue);
        }

        .ns-age-scale {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 13px;
        }

        .ns-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px 20px;
        }

        .ns-field label,
        .ns-age label {
            font-size: 14px;
            font-weight: 700;
        }

        .ns-field input,
        .ns-field select {
            display: block;
            width: 100%;
            min-height: 46px;
            margin-top: 5px;
            padding: 9px 12px;
            border: 1px solid #a9b7cc;
            border-radius: 10px;
            color: var(--ink);
            background: var(--white);
            font: inherit;
        }

        /* Buttons */
        .ns-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .ns-button {
            min-height: 46px;
            padding: 10px 18px;
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .ns-next {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            color: var(--white);
            background: var(--blue-dark);
        }

        .ns-next:hover {
            background: #1e40af;
        }

        .ns-replay {
            color: var(--blue-dark);
            background: #e2ecff;
        }

        .ns-replay:hover {
            background: #cedeff;
        }

        @media (max-width: 600px) {
            .ns-nav {
                padding-inline: 16px;
            }

            .ns-main {
                margin-top: 20px;
            }

            .ns-grid {
                grid-template-columns: 1fr;
            }

            .ns-next {
                width: 100%;
            }
        }
    </style>
</head>

<body class="ns-assessment">
    <header class="ns-topbar">
        <div class="ns-nav">
            <div class="ns-brand">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="">
                <span>NeuroSense</span>
            </div>

            <nav class="ns-links" aria-label="Patient navigation">
                <a href="patient_dashboard" {% if active_page=='dashboard' %} aria-current="page" {% endif
                    %}>Dashboard</a>
                <a href="assessment" {% if active_page=='assessment' %} aria-current="page" {% endif %}>Start
                    Assessment</a>
                <a href="timeline" {% if active_page=='timeline' %} aria-current="page" {% endif %}>Health Timeline</a>
                <a href="ehr" {% if active_page=='ehr' %} aria-current="page" {% endif %}>My EHR</a>
                <a href="patient_profile" {% if active_page=='profile' %} aria-current="page" {% endif %}>My Profile</a>
            </nav>
        </div>
    </header>

    <main class="ns-main">
        <header class="ns-hero">
            <p class="ns-step">Step 1 of 4</p>
            <h1>Neurological Risk Assessment</h1>

            <div class="ns-progress" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <form method="POST">
            <input type="hidden" name="step" value="{{ step }}">

            <section class="ns-card" id="voice-card" aria-labelledby="voice-heading" hidden>
                <div class="ns-voice-head">
                    <div>
                        <h2 id="voice-heading">Voice mode</h2>
                        <p class="ns-note">Listen to the questions in English.</p>
                    </div>

                    <label class="ns-switch">
                        <input id="voice-mode" type="checkbox" role="switch" aria-labelledby="voice-heading"
                            aria-controls="voice-panel" autocomplete="off">
                    </label>
                </div>

                <div class="ns-voice-panel" id="voice-panel" hidden>
                    <button class="ns-button ns-replay" id="replay" type="button">
                        Read questions aloud
                    </button>
                    <p class="ns-note">Enter your answers in the form below.</p>
                </div>
            </section>

            <section class="ns-card" aria-labelledby="demographics-heading">
                <h2 id="demographics-heading">Demographic information</h2>
                <p>Tell us a little about yourself.</p>

                <div class="ns-age">
                    <div class="ns-age-head">
                        <label for="age">Age</label>
                        <output for="age" id="age-value">65 years</output>
                    </div>

                    <input id="age" name="age" type="range" min="18" max="100" value="65" aria-valuetext="65 years">

                    <div class="ns-age-scale" aria-hidden="true">
                        <span>18 years</span>
                        <span>100 years</span>
                    </div>
                </div>

                <div class="ns-grid">
                    <div class="ns-field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option>Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="ns-field">
                        <label for="weight">Weight (kg)</label>
                        <input id="weight" name="weight" type="number" value="70">
                    </div>

                    <div class="ns-field">
                        <label for="height">Height (cm)</label>
                        <input id="height" name="height" type="number" value="170">
                    </div>

                    <div class="ns-field">
                        <label for="education">Education level</label>
                        <select id="education" name="education">
                            <option>Select education</option>
                            <option value="High School">High School</option>
                            <option value="Bachelors Degree">Bachelor’s Degree</option>
                            <option value="Masters Degree">Master’s Degree</option>
                            <option value="Doctorate">Doctorate</option>
                        </select>
                    </div>

                    <div class="ns-field">
                        <label for="occupation">Occupation</label>
                        <input id="occupation" name="occupation" type="text" placeholder="e.g. Engineer, Teacher">
                    </div>

                    <div class="ns-field">
                        <label for="language">Language preference</label>
                        <select id="language" name="languagePreference">
                            <option>Select language</option>
                            <option value="English">English</option>
                            <option value="Hindi">Other</option>
                        </select>
                    </div>
                </div>
            </section>

            <div class="ns-footer">
                <button class="ns-button ns-next" type="submit">
                    Next <span aria-hidden="true">→</span>
                </button>
            </div>
        </form>
    </main>

    <script>
        const ageInput = document.getElementById("age");
        const ageValue = document.getElementById("age-value");

        function updateAge() {
            const label = ageInput.value + " years";
            ageValue.textContent = label;
            ageInput.setAttribute("aria-valuetext", label);
        }

        ageInput.addEventListener("input", updateAge);
        updateAge();

        if ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) {
            const speech = window.speechSynthesis;
            const voiceMode = document.getElementById("voice-mode");
            const voicePanel = document.getElementById("voice-panel");

            document.getElementById("voice-card").hidden = false;
            voicePanel.hidden = !voiceMode.checked;

            voiceMode.addEventListener("change", () => {
                voicePanel.hidden = !voiceMode.checked;

                if (!voiceMode.checked) {
                    speech.cancel();
                }
            });

            document.getElementById("replay").addEventListener("click", () => {
                speech.cancel();

                const questions = new SpeechSynthesisUtterance(
                    "How old are you? What is your gender? " +
                    "What is your weight in kilograms? " +
                    "What is your height in centimetres? " +
                    "What is your highest education level? " +
                    "What is your occupation? Which language do you prefer?"
                );

                questions.lang = "en-AU";
                speech.speak(questions);
            });

            window.addEventListener("pagehide", () => speech.cancel());
        }
    </script>
</body>

</html>
